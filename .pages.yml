      - { name: skills, component: skills }
      - { name: summary, type: text, label: Summary (1-2 sentences), required: false }
      - { name: keyMessage, type: text, label: The one idea, required: false }
      - {
          name: body,
          type: rich-text,
          label: Story text,
          description: 'Write it here like a document. A horizontal line (Insert, divider) starts a new page.',
        }
      - { name: questions, component: questions }
      - { name: discussion, component: discussion }
      - { name: coverAlt, type: text, label: Cover alt text (this language) }
      - name: frameAlts
        type: text
        label: Page picture alt texts (this language)
        description: Same order as the German file's page pictures.
        list: true
      - { name: narration, component: narration }
      - { name: reviewedBy, type: string, label: Reviewed by (a native speaker) }
      - { name: reviewedAt, type: date, label: Reviewed on }
