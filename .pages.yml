settings:
  content: true # keep frontmatter the forms do not show
  commit:
    identity: app # the repo is public: never put a moderator's email in git history
    templates:
      create: "content: add {path}"
      update: "content: update {path}"
      delete: "content: remove {path}"
      rename: "content: rename {oldPath} to {newPath}"

media:
  - name: art
    label: Story art
    input: public/assets/stories
    output: /assets/stories
    extensions: [webp, png, svg]
    rename: false
  - name: audio
    label: Narration audio
    input: public/assets/audio
    output: /assets/audio
    extensions: [m4a, opus, json]
    rename: false

components:
  skills:
    type: select
    label: Skills
    required: true
    description: Pick 1 to 3.
    options:
      multiple: true
      min: 1
      max: 3
      values:
        - self-awareness
        - emotional-regulation
        - empathy
        - patience
        - impulse-control
        - effective-communication
        - cooperation
        - conflict-resolution
        - leadership
        - respect
        - problem-solving
        - decision-making
        - critical-thinking
        - adaptability
        - goal-setting
        - responsibility
        - honesty
        - persistence
        - self-discipline
        - time-management
        # Used by existing stories but missing from src/utils/skills-taxonomy.ts; resolve, then remove.
        - anger-management
        - attention
        - communication
        - courage
        - delayed-gratification
        - emotional-expression
        - flexibility
        - focus
        - generosity
        - motivation
        - organization
        - planning
        - self-confidence
        - self-control
        - sharing
        - teamwork
  questions:
    type: object
    label: Questions
    description: Talk prompts. Nothing is scored.
    list:
      collapsible:
        collapsed: true
        summary: "{fields.text}"
    fields:
      - { name: id, type: string, label: Id, required: true, description: "Short and unique within the story, e.g. q1" }
      - { name: text, type: text, label: Question, required: true }
      - name: type
        type: select
        label: Kind
        required: true
        options:
          values: [truefalse, multiplechoice, fillinblank]
      - { name: correctAnswer, type: string, label: Answer the story supports }
      - { name: options, type: string, label: Choices, list: true }
  discussion:
    type: text
    label: Questions for the grown-up
    list: true
  narration:
    type: object
    label: Narration
    fields:
      - { name: audio, type: string, label: Audio folder name }
      - { name: narrator, type: string, label: Narrator credit }
      - { name: consent, type: string, label: Narrator consent note }
      - { name: timing, type: boolean, label: Word timings (nn.json) exist, default: false }

content:
  - name: stories-de
    label: Deutsch (Quelle)
    type: collection
    path: src/content/stories/de
    subfolders: false
    operations:
      create: true
      rename: false
      delete: false
    filename: "{storyId}.md"
    view:
      fields: [title, storyId, status]
      primary: title
      search: [title, storyId, status]
      sort: [storyId, title]
      default:
        sort: storyId
        order: asc
    fields:
      - name: storyId
        type: string
        label: Story id
        required: true
        description: Same in every language. Never change it after publishing.
        pattern:
          regex: "^[0-9]{3}-[a-z0-9-]+$"
          message: "Use three digits, a dash and a lowercase name, e.g. 023-nora"
      - name: status
        type: select
        label: Status
        default: draft
        options:
          values: [draft, published]
      - { name: title, type: string, label: Title, required: true }
      - { name: emoji, type: string, label: Emoji, required: true, default: "📖" }
      - { name: skills, component: skills }
      - { name: summary, type: text, label: Summary (1-2 sentences), required: false }
      - { name: keyMessage, type: text, label: The one idea, required: false }
      - { name: body, type: rich-text, label: Story text, required: false, description: "Write it here like a document. A horizontal line (Insert, divider) starts a new page." }
      - { name: questions, component: questions }
      - { name: discussion, component: discussion }
      - { name: narration, component: narration }
      - { name: publishDate, type: date, label: First published }
      - { name: reviewedBy, type: string, label: Reviewed by }
      - { name: reviewedAt, type: date, label: Reviewed on }
  - name: stories-en
    label: English
    type: collection
    path: src/content/stories/en
    subfolders: false
    operations:
      create: true
      rename: false
      delete: false
    filename: "{storyId}.md"
