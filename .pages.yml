# Pages CMS config. The schema of record is src/content.config.ts; keep field names in step with it.
# Shared fields (band, cover, frames, palette, art) are set in the German file only; every other
# language file carries its own text and its own alt text (coverAlt, frameAlts).

settings:
  content: true # keep frontmatter the forms do not show (palette, legacy fields)
  commit:
    identity: app # the repo is public: never put a moderator's email in git history
    templates:
      create: 'content: add {path}'
      update: 'content: update {path}'
      delete: 'content: remove {path}'
      rename: 'content: rename {oldPath} to {newPath}'

media:
  - name: art
    label: Story art
    input: public/assets/stories
    output: /assets/stories
    extensions: [webp, png, svg]
    rename: false # file names follow docs/roadmap/02-content-model.md; do not slugify
  - name: audio
    label: Narration audio
    input: public/assets/audio
    output: /assets/audio
    extensions: [m4a, opus, json]
    rename: false

components:
  skills:
    type: select
    label: Skills
    required: true
    description: Pick 1 to 3.
    options:
      multiple: true
      min: 1
      max: 3
      values:
        - self-awareness
        - emotional-regulation
        - empathy
        - patience
        - impulse-control
        - effective-communication
        - cooperation
        - conflict-resolution
        - leadership
        - respect
        - problem-solving
        - decision-making
        - critical-thinking
        - adaptability
        - goal-setting
        - responsibility
        - honesty
        - persistence
        - self-discipline
        - time-management
        # Used by existing stories but missing from src/utils/skills-taxonomy.ts; resolve, then remove.
        - anger-management
        - attention
        - communication
        - courage
        - delayed-gratification
        - emotional-expression
        - flexibility
        - focus
        - generosity
        - motivation
        - organization
        - planning
        - self-confidence
        - self-control
        - sharing
        - teamwork
  questions:
    type: object
    label: Questions
    description: Talk prompts. Nothing is scored.
    list:
      collapsible:
        collapsed: true
        summary: '{fields.text}'
    fields:
      - {
          name: id,
          type: string,
          label: Id,
          required: true,
          description: 'Short and unique within the story, e.g. q1',
        }
      - { name: text, type: text, label: Question, required: true }
      - name: type
        type: select
        label: Kind
        required: true
        options:
          values: [truefalse, multiplechoice, fillinblank]
      - { name: correctAnswer, type: string, label: Answer the story supports }
      - { name: options, type: string, label: Choices, list: true }
  discussion:
    type: text
    label: Questions for the grown-up
    list: true
  narration:
    type: object
    label: Narration
    fields:
      - {
          name: audio,
          type: string,
          label: Audio folder name,
          description: 'Folder under assets/audio/<language>/ with one file per page: 01.m4a, 02.m4a ...',
        }
      - { name: narrator, type: string, label: Narrator credit }
      - { name: consent, type: string, label: Narrator consent note }
      - { name: timing, type: boolean, label: Word timings (nn.json) exist, default: false }

content:
  - name: stories-de
    label: Deutsch (Quelle)
    type: collection
    path: src/content/stories/de
    subfolders: false
    operations:
      create: true
      rename: false
      delete: false
    filename: '{storyId}.md'
    view:
      fields: [title, storyId, status, band]
      primary: title
      search: [title, storyId, status]
      sort: [storyId, title]
      default:
        sort: storyId
        order: asc
    fields:
      - name: storyId
        type: string
        label: Story id
        required: true
        description: Same in every language. Never change it after publishing.
        pattern:
          regex: '^[0-9]{3}-[a-z0-9-]+$'
          message: 'Use three digits, a dash and a lowercase name, e.g. 023-nora'
      - name: status
        type: select
        label: Status
        default: draft
        options:
          values: [draft, published]
      - { name: title, type: string, label: Title, required: true }
      - {
          name: emoji,
          type: string,
          label: Emoji (shown when there is no picture),
          required: true,
          default: '📖',
        }
      - { name: skills, component: skills }
      - { name: summary, type: text, label: Summary (1-2 sentences), required: false }
      - { name: keyMessage, type: text, label: The one idea, required: false }
      - {
          name: body,
          type: rich-text,
          label: Story text,
          description: 'Write it here like a document. A horizontal line (Insert, divider) starts a new page.',
        }
      - { name: questions, component: questions }
      - { name: discussion, component: discussion }
      - name: band
        type: select
        label: Band
        required: true
        description: Set once, here. 1 picture book (3-5), 2 read-along (6-7), 3 chapter story (8-9), 4 long read (10-12).
        options:
          values:
            - { value: '1', label: '1 Picture book' }
            - { value: '2', label: '2 Read-along' }
            - { value: '3', label: '3 Chapter story' }
            - { value: '4', label: '4 Long read' }
      - name: cover
        type: object
        label: Cover
        fields:
          - { name: src, type: image, label: Picture, options: { media: art } }
          - { name: alt, type: text, label: Alt text (German) }
      - name: frames
        type: object
        label: Page pictures
        description: In page order. A page without a picture shows the generated fallback.
        list:
          collapsible:
            collapsed: true
            summary: '{index}'
        fields:
          - { name: src, type: image, label: Picture, options: { media: art } }
          - { name: alt, type: text, label: Alt text (German) }
          - {
              name: pageRef,
              type: number,
              label: Page number (only if it differs from its position),
            }
      - name: art
        type: object
        label: How the art was made
        description: Required once the story has art.
        fields:
          - { name: generator, type: string, label: Tool and model }
          - { name: styleVersion, type: string, label: Style guide version }
          - { name: reviewedBy, type: string, label: Reviewed by }
          - { name: reviewedAt, type: date, label: Reviewed on }
          - { name: aiGenerated, type: boolean, label: Made with AI, default: true }
      - { name: publishDate, type: date, label: First published }
      - { name: ageGroup, type: string, hidden: true, default: '3-7' }
      - { name: narration, component: narration }
  - name: stories-en
    label: English
    type: collection
    path: src/content/stories/en
    subfolders: false
    operations:
      create: true
      rename: false
      delete: false
    filename: '{storyId}.md'
    view:
      fields: [title, storyId, status, reviewedBy]
      primary: title
      search: [title, storyId, status]
      sort: [storyId, title]
      default:
        sort: storyId
        order: asc
    fields:
      - name: storyId
        type: reference
        label: Story (pick the German original)
        required: true
        description: Choose from the list so the languages always match.
        options:
          collection: stories-de
          search: fields.title
          value: '{fields.storyId}'
          label: '{fields.storyId} - {fields.title}'
      - name: status
        type: select
        label: Status
        default: draft
        options:
          values: [draft, published]
      - { name: title, type: string, label: Title, required: true }
      - {
          name: emoji,
          type: string,
          label: Emoji (shown when there is no picture),
          required: true,
          default: '📖',
