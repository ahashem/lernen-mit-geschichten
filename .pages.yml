        type: reference
        label: Story (pick the German original)
        required: true
        description: Choose from the list so the languages always match.
        options:
          collection: stories-de
          search: fields.title
          value: "{fields.storyId}"
          label: "{fields.storyId} - {fields.title}"
      - name: status
