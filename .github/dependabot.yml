version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
    groups:
      # astro and its integrations must move together; split bumps break the build
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      lint-format:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'prettier*'
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
