name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # format:check + lint + test; lint also enforces the getCollection ban
      - run: npm run quality

      - run: npm run build
        env:
          # astro.config.mjs refuses to build without it; same derivation as deploy.yml
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NOINDEX: '1'
