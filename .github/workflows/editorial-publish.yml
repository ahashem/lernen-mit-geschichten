name: Publish stories

# Moderators save in the CMS, which commits to `editorial`. When the checks pass, this publishes `editorial`'s files
# to `main` as one new commit made through the API with the built-in GITHUB_TOKEN, so both deploys follow with no human
# merge and no personal token. GitHub signs that commit and it sits on top of `main`, which the `main` ruleset
# (signed commits, linear history) requires. No pull request: GitHub's signed-commit check blocks pull requests from
# `editorial` unpredictably over the unsigned commits in its history (the bot's merges, saves made with a GitHub
# login), while a commit the job makes itself does not depend on that history. Only story and media files may differ from `main`; anything
# else goes through a pull request to `main`. A story goes live when its status is `published`. The publishing gate
# (scripts/publish-gates.mjs --changed) refuses a save that would lose a field; with the STRICT_PUBLISHING repository
# variable set to 1 it also refuses a published file that is incomplete or unreviewed.
#
# Pushes made with GITHUB_TOKEN start no other workflow, so the Pages deploy is dispatched explicitly at the end.
# This workflow runs on pushes to `editorial` and by hand (Actions > Publish stories > Run workflow), never on pull
# requests, so a pull request from a fork cannot reach it.
on:
  push:
    branches: [editorial]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: editorial-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      STRICT_PUBLISHING: ${{ vars.STRICT_PUBLISHING }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: editorial
          fetch-depth: 0

      - name: Bring main into editorial
        run: |
          git config user.name "editorial-bot"
          git config user.email "editorial-bot@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin HEAD:editorial

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Publishing gate (changed files only)
        run: node scripts/publish-gates.mjs --changed=origin/main

      - run: npm run quality

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NOINDEX: '1'

      - name: Publish as a signed commit on main
        run: |
          git fetch origin main
          # Built from editorial's files, so main must be inside editorial or the commit would undo it.
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main moved during this run; the next run publishes."
            exit 1
          fi
          if git diff --quiet origin/main HEAD; then
            echo "Nothing to publish."
            exit 0
          fi
          other=$(git diff --name-only origin/main HEAD | grep -v -E '^(src/content/|public/assets/)' || true)
          if [ -n "$other" ]; then
            echo "::error::editorial changes files the CMS does not edit; land them through a pull request to main:"
            echo "$other"
            exit 1
          fi
          repo="repos/$GITHUB_REPOSITORY"
          commit=$(gh api "$repo/git/commits" -f message='content: publish editorial changes' \
            -f tree="$(git rev-parse 'HEAD^{tree}')" -f 'parents[]'="$(git rev-parse origin/main)" --jq .sha)
          if [ "$(gh api "$repo/git/commits/$commit" --jq .verification.verified)" != true ]; then
            echo "::error::GitHub did not sign $commit, and main accepts signed commits only. Nothing was published."
            exit 1
          fi
          # Not forced: if main moved since the fetch, this is refused and nothing changes.
          gh api -X PATCH "$repo/git/refs/heads/main" -f sha="$commit" -F force=false --silent
          echo "Published $commit." >> "$GITHUB_STEP_SUMMARY"
          for n in $(gh pr list --head editorial --base main --state open --json number --jq '.[].number'); do
            gh pr close "$n" --comment "Published as $commit by the publish workflow, without a pull request."
          done
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:editorial
          gh workflow run deploy.yml --ref main
