name: Publish stories

# CMS saves land on `editorial`; when the checks pass, its src/content and public/assets go to `main` as one commit
# made through the API, which GitHub signs (`main` requires signed commits). GITHUB_TOKEN pushes start no workflow,
# so the deploy is dispatched by hand. See docs/roadmap/03.
on:
  push:
    branches: [editorial]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: editorial-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      STRICT_PUBLISHING: ${{ vars.STRICT_PUBLISHING }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: editorial
          fetch-depth: 0

      - name: Bring main into editorial
        run: |
          git config user.name "editorial-bot"
          git config user.email "editorial-bot@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin HEAD:editorial

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Publishing gate (changed files only)
        run: node scripts/publish-gates.mjs --changed=origin/main

      - run: npm run quality

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NOINDEX: '1'

      - name: Publish as a signed commit on main
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          base=$(git rev-parse origin/main)
          tree=$(jq -n --arg b "$(git rev-parse "$base^{tree}")" \
            --arg c "$(git rev-parse HEAD:src/content)" --arg a "$(git rev-parse HEAD:public/assets)" \
            '{base_tree: $b, tree: [{path: "src/content", mode: "040000", type: "tree", sha: $c},
                                     {path: "public/assets", mode: "040000", type: "tree", sha: $a}]}' |
            gh api "$repo/git/trees" --input - --jq .sha)
          other=$(git -c core.quotePath=false diff --name-only --no-renames "$base" HEAD -- . ':!src/content' ':!public/assets')
          if [ -n "$other" ]; then
            echo "::warning::editorial differs from main outside the content folders; not published:" $other
          fi
          if [ "$tree" = "$(git rev-parse "$base^{tree}")" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          ids=$(git diff --name-only --no-renames "$base" HEAD -- src/content/stories |
            sed -n 's#^src/content/stories/[a-z]*/\(.*\)\.md$#\1#p' | sort -u)
          stories=$(echo "$ids" | head -5 | paste -sd ' ' -)
          n=$(echo "$ids" | grep -c . || true)
          if [ "$n" -gt 5 ]; then stories="$stories and $((n - 5)) more"; fi
          commit=$(gh api "$repo/git/commits" -f message="content: publish ${stories:-editorial changes}" \
            -f tree="$tree" -f 'parents[]'="$base" --jq .sha)
          if [ "$(gh api "$repo/git/commits/$commit" --jq .verification.verified)" != true ]; then
            echo "::error::GitHub did not sign $commit; main accepts signed commits only. Nothing was published."
            exit 1
          fi
          if ! gh api -X PATCH "$repo/git/refs/heads/main" -f sha="$commit" -F force=false --silent; then
            if [ "$(gh api "$repo/git/ref/heads/main" --jq .object.sha)" != "$base" ]; then
              echo "main moved during this run; publishing again."
              gh workflow run editorial-publish.yml --ref editorial
              exit 0
            fi
            exit 1
          fi
          gh workflow run deploy.yml --ref main
          echo "Published $commit." >> "$GITHUB_STEP_SUMMARY"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:editorial || echo "::notice::editorial moved; its next run merges main back."
