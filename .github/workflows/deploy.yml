name: Deploy to GitHub Pages

# Staging is `main` at the site root; the moderators' preview is the `editorial` branch at /preview/, with drafts
# visible. One Pages deployment carries both. Production (Hostinger) builds `main` on its own.
on:
  push:
    branches: [main, editorial]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          path: site

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # The only place tests run for main. Hostinger builds production from the same
      # commit but is locked to `npm run build`, which no longer runs them.
      - name: Run tests
        working-directory: site
        run: npm test

      - name: Build staging (main)
        working-directory: site
        env:
          SITE_URL: ${{ env.PAGES_URL }}
          NOINDEX: '1'
        run: BUILD_SHA=$(git rev-parse --short HEAD) npm run build

      - name: Detect the editorial branch
        id: detect
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" editorial >/dev/null; then
            echo "has_editorial=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout editorial
        if: steps.detect.outputs.has_editorial == 'true'
        uses: actions/checkout@v7
        with:
          ref: editorial
          path: preview-src
          fetch-depth: 0

      - name: Publishing gate on the editorial branch
        if: steps.detect.outputs.has_editorial == 'true'
        working-directory: preview-src
        continue-on-error: true
        run: node scripts/publish-gates.mjs --changed=origin/main > "$GITHUB_WORKSPACE/gate.txt" 2>&1

      - name: Build preview (editorial, drafts visible)
        id: preview
        if: steps.detect.outputs.has_editorial == 'true'
        working-directory: preview-src
        continue-on-error: true
        env:
          SITE_URL: ${{ env.PAGES_URL }}/preview
          NOINDEX: '1'
          SHOW_DRAFTS: '1'
        run: |
          npm ci
          BUILD_SHA=$(git rev-parse --short HEAD) npm run build 2>&1 | tee "$GITHUB_WORKSPACE/preview-build.txt"

      - name: Assemble the site
        run: |
          mkdir out
          cp -r site/dist/. out/
          BUILD=none
          if [ "${{ steps.detect.outputs.has_editorial }}" = "true" ]; then
            BUILD=failed
            if [ "${{ steps.preview.outcome }}" = "success" ]; then
              BUILD=ok
              mkdir -p out/preview
              cp -r preview-src/dist/. out/preview/
            else
              tail -n 25 preview-build.txt >> gate.txt 2>/dev/null || true
            fi
          fi
          SHA=$(git -C preview-src rev-parse --short HEAD 2>/dev/null || echo none)
          STORIES=site/src/content/stories
          if [ -d preview-src ]; then STORIES=preview-src/src/content/stories; fi
          node site/scripts/preview-status.mjs out/preview/status/index.html "$BUILD" "$SHA" gate.txt "$STORIES"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
