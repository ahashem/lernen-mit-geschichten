storyId: 040-lilo-maus
drafted: '2026-11-04'
en:
  summary: Lilo the mouse and her friend Fips argue when their ball falls into a puddle. Laughing about the “swimming tomato” ends the quarrel and shows how humour makes problems smaller.
ar:
  summary: تتشاجر الفأرة ليلو وصديقها فيبس عندما تسقط كرتهما في بركة ماء. لكنّ ضحكة على «الطماطم السابحة» تُنهي الخلاف، وتُظهر كيف تجعل روح الدعابة المشكلات أصغر.
tr:
  summary: Fare Lilo ile arkadaşı Fips, topları bir su birikintisine düşünce tartışır. “Yüzen domates”e gülmek kavgayı bitirir ve mizahın sorunları nasıl küçülttüğünü gösterir.
ur:
  summary: لیلو چوہیا اور اُس کے دوست فِپس کی لڑائی ہو جاتی ہے جب اُن کی گیند پانی کے گڑھے میں گر جاتی ہے۔ “تیرتے ٹماٹر” پر ہنسی لڑائی ختم کر دیتی ہے اور دکھاتی ہے کہ مزاح مسائل کو کیسے چھوٹا کر دیتا ہے۔
