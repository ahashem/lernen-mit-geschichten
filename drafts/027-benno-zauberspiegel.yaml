storyId: 027-benno-zauberspiegel
drafted: '2026-11-04'
en:
  summary: Little Benno finds a magic mirror that helps him watch his own behaviour and ask himself three questions.
  keyMessage: 'Look honestly in the mirror: knowing yourself helps you grow.'
ar:
  summary: يجد بِنّو الصغير مرآة سحرية تساعده على أن يراقب تصرّفاته ويسأل نفسه ثلاثة أسئلة.
  keyMessage: 'انظر إلى المرآة بصدق: من يعرف نفسه ينمو.'
tr:
  summary: Küçük Benno, kendi davranışlarını gözlemlemesine ve kendine üç soru sormasına yardım eden sihirli bir ayna bulur.
  keyMessage: 'Aynaya dürüstçe bak: Kendini tanıyan büyür.'
ur:
  summary: ننھا بینّو ایک جادوئی آئینہ پاتا ہے جو اُسے اپنے رویّے پر نظر رکھنے اور خود سے تین سوال پوچھنے میں مدد دیتا ہے۔
  keyMessage: 'آئینے میں ایمانداری سے دیکھو: جو خود کو پہچانتا ہے، وہ آگے بڑھتا ہے۔'
