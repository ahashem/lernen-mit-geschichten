storyId: 031-lina-lange-nase
drafted: '2026-11-04'
en:
  summary: Lina, a little mouse, is given away during hide-and-seek and gets angry – but she counts to three, takes a deep breath and tames her anger.
ar:
  summary: تُكشَف الفأرة الصغيرة لينا وهي تلعب الغمّيضة فتغضب، لكنّها تعدّ إلى ثلاثة وتأخذ نفسًا عميقًا وتروّض غضبها.
tr:
  summary: Küçük fare Lina saklambaçta ele verilir ve kızar – ama üçe kadar sayar, derin bir nefes alır ve öfkesini yatıştırır.
ur:
  summary: چھپن چھپائی کھیلتے ہوئے ننھی چوہیا لِینا کا راز کھل جاتا ہے اور اُسے غصہ آتا ہے – لیکن وہ تین تک گنتی ہے، گہری سانس لیتی ہے اور اپنے غصے پر قابو پا لیتی ہے۔
