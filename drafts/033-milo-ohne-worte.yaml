storyId: 033-milo-ohne-worte
drafted: '2026-11-04'
en:
  summary: Milo, a curious monkey in a small zoo, understands the gestures and looks of the other animals – and shows that you can understand each other even without words.
ar:
  summary: ميلو قرد فضولي يعيش في حديقة حيوانات صغيرة، يفهم إشارات الحيوانات الأخرى ونظراتها، فيُظهر أنّنا نستطيع أن نتفاهم حتى من دون كلمات.
tr:
  summary: Küçük bir hayvanat bahçesinde yaşayan meraklı maymun Milo, diğer hayvanların jestlerini ve bakışlarını anlar – ve kelimeler olmadan da anlaşılabileceğini gösterir.
ur:
  summary: ایک چھوٹے سے چڑیا گھر میں رہنے والا تجسّس کرنے والا بندر میلو دوسرے جانوروں کے اشارے اور نظریں سمجھتا ہے – اور دکھاتا ہے کہ ہم الفاظ کے بغیر بھی ایک دوسرے کو سمجھ سکتے ہیں۔
