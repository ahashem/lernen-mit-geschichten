storyId: 026-timo-schildkroete
drafted: '2026-11-04'
en:
  summary: Timo, the little turtle, is slow and shy. But Timo learns that everyone has their own strengths – and that it is good to be just the way you are.
ar:
  summary: تيمو سلحفاة صغيرة بطيئة وخجولة. لكنّه يتعلّم أنّ لكلّ واحد نقاط قوّته، وأنّه جيّد كما هو.
tr:
  summary: Küçük kaplumbağa Timo yavaş ve utangaçtır. Ama herkesin kendine özgü güçlü yanları olduğunu ve olduğu gibi iyi olduğunu öğrenir.
ur:
  summary: چھوٹا کچھوا تیمو سست اور شرمیلا ہے۔ لیکن وہ سیکھتا ہے کہ ہر ایک کی اپنی خوبیاں ہوتی ہیں، اور وہ جیسا ہے ویسا ہی اچھا ہے۔
