storyId: 038-tilda-schildkroete
drafted: '2026-11-04'
en:
  summary: 'Tilda, a little turtle, is the slowest in the swimming race. But on the way she discovers colourful stones, a sleeping crab and a silver shell. She learns: everyone has their own pace, and strengths are sometimes hidden where you do not see them at first.'
ar:
  summary: تيلدا السلحفاة الصغيرة هي الأبطأ في سباق السباحة، لكنّها تكتشف في طريقها حجارة ملوّنة وسرطانًا نائمًا وصدفة فضّية. وتتعلّم أنّ لكلّ واحد سرعته، وأنّ نقاط القوّة تختبئ أحيانًا حيث لا نراها أوّلًا.
tr:
  summary: Küçük kaplumbağa Tilda yüzme yarışında en yavaş olandır. Ama yolda renkli taşlar, uyuyan bir yengeç ve gümüş rengi bir deniz kabuğu keşfeder. Herkesin kendi hızı olduğunu ve güçlü yanların bazen ilk bakışta görünmeyen yerlerde saklı olduğunu öğrenir.
ur:
  summary: ننھی کچھوا ٹلڈا تیراکی کی دوڑ میں سب سے سست ہے۔ لیکن راستے میں وہ رنگ برنگے پتھر، ایک سوتا ہوا کیکڑا اور ایک چاندی جیسی سیپی دیکھتی ہے۔ وہ سیکھتی ہے کہ ہر ایک کی اپنی رفتار ہوتی ہے، اور خوبیاں کبھی کبھی وہاں چھپی ہوتی ہیں جہاں ہم انہیں پہلے نہیں دیکھتے۔
