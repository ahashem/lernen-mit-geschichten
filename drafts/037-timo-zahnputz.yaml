storyId: 037-timo-zahnputz
drafted: '2026-11-04'
en:
  summary: Timo is a cheerful but forgetful boy who often forgets to brush his teeth in the morning. A talking alarm clock shaped like a squirrel helps him keep to his routine.
ar:
  summary: تِيمُو صبيّ مرح لكنّه كثير النسيان، ينسى غالبًا أن يفرّش أسنانه في الصباح. يساعده منبّه متكلّم على شكل سنجاب على الالتزام بروتينه.
tr:
  summary: Timo neşeli ama unutkan bir çocuktur ve sabahları sık sık dişlerini fırçalamayı unutur. Sincap şeklindeki konuşan bir çalar saat, rutinine uymasına yardım eder.
ur:
  summary: ٹی مو ایک خوش مزاج مگر بھلکڑ لڑکا ہے جو صبح اکثر دانت برش کرنا بھول جاتا ہے۔ گلہری کی شکل کا ایک بولنے والا الارم کلاک اُسے اپنی روٹین پر قائم رہنے میں مدد دیتا ہے۔
