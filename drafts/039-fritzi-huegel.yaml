storyId: 039-fritzi-huegel
drafted: '2026-11-04'
en:
  summary: Fritzi wants to ride his scooter down the highest hill and falls twice. With courage and the encouraging words of his friend Lotte, he learns that mistakes are not the end but the start of a new try.
ar:
  summary: يريد فِريتْسي أن ينزل بدرّاجته من أعلى تلّ فيسقط مرّتين. وبالشجاعة وبكلمات صديقته لوتّه المشجّعة، يتعلّم أنّ الأخطاء ليست النهاية، بل بداية محاولة جديدة.
tr:
  summary: Fritzi scooter’ıyla en yüksek tepeden aşağı inmek ister ve iki kez düşer. Cesareti ve arkadaşı Lotte’nin cesaret veren sözleriyle, hataların son değil, yeni bir denemenin başlangıcı olduğunu öğrenir.
ur:
  summary: فریٹزی اپنی اسکوٹر پر سب سے اونچی پہاڑی سے نیچے جانا چاہتا ہے اور دو بار گر جاتا ہے۔ ہمت اور اپنی دوست لوٹے کی حوصلہ افزا باتوں سے وہ سیکھتا ہے کہ غلطیاں انجام نہیں بلکہ ایک نئی کوشش کی شروعات ہیں۔
