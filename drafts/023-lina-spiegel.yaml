storyId: 023-lina-spiegel
drafted: '2026-11-04'
en:
  summary: Lina falls while practising riding her bike without training wheels, but her mirror sings to her how to cheer herself on – and the next try already goes better.
ar:
  summary: تسقط لينا وهي تتدرّب على ركوب الدرّاجة من دون العجلات الصغيرة، لكنّ مرآتها تغنّي لها كيف تشجّع نفسها، فتنجح المحاولة التالية بشكل أفضل.
tr:
  summary: Lina, yardımcı tekerlekler olmadan bisiklete binmeyi denerken düşer; ama aynası ona kendini nasıl cesaretlendireceğini şarkıyla anlatır – ve bir sonraki deneme daha iyi gider.
ur:
  summary: لِینا بغیر چھوٹے پہیوں کے سائیکل چلانا سیکھتے ہوئے گر جاتی ہے، لیکن اُس کا آئینہ گا کر بتاتا ہے کہ وہ خود کو کیسے حوصلہ دے – اور اگلی کوشش پہلے سے بہتر ہوتی ہے۔
