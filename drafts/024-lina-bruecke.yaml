storyId: 024-lina-bruecke
drafted: '2026-11-04'
en:
  summary: The bridge over the river has disappeared. While the villagers just wait, unsure what to do, Lina builds a raft out of pumpkins and finds a surprising way to the other bank.
ar:
  summary: اختفى الجسر الذي يعبر النهر. وبينما ينتظر أهل القرية حائرين، تصنع لينا طَوْفًا من القرع وتجد طريقًا مفاجئًا إلى الضفّة الأخرى.
tr:
  summary: Nehrin üzerindeki köprü kaybolmuştur. Köylüler ne yapacaklarını bilemeden beklerken Lina balkabaklarından bir sal yapar ve karşı kıyıya şaşırtıcı bir yol bulur.
ur:
  summary: دریا پر بنا پل غائب ہو گیا ہے۔ گاؤں والے پریشان ہو کر بس انتظار کرتے ہیں، مگر لینا کدوؤں سے ایک بیڑا بناتی ہے اور دوسرے کنارے تک پہنچنے کا ایک حیران کن راستہ ڈھونڈ لیتی ہے۔
