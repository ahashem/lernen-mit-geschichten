storyId: 025-paula-wut-drache
drafted: '2026-11-04'
en:
  summary: Paula has a little anger dragon called Funkel in her tummy. She learns to notice her anger and breathe calmly instead of shouting.
  keyMessage: Anger is normal – but you can learn to let it out without shouting.
ar:
  summary: في بطن باولا تنّين غضب صغير اسمه فونكل. تتعلّم أن تنتبه لغضبها وأن تتنفّس بهدوء بدلًا من الصراخ.
  keyMessage: الغضب أمر طبيعي، لكن يمكنك أن تتعلّم كيف تتخلّص منه من دون صراخ.
tr:
  summary: Paula’nın karnında Funkel adında küçük bir öfke ejderhası vardır. Paula öfkesini fark etmeyi ve bağırmak yerine sakin nefes almayı öğrenir.
  keyMessage: Öfkelenmek normaldir – ama bağırmadan onu dışarı atmayı öğrenebilirsin.
ur:
  summary: پاؤلا کے پیٹ میں فنکِل نام کا ایک چھوٹا سا غصے والا اژدہا رہتا ہے۔ وہ اپنا غصہ پہچاننا اور چیخنے کے بجائے آرام سے سانس لینا سیکھتی ہے۔
  keyMessage: غصہ آنا عام بات ہے – لیکن تم چیخے بغیر اسے نکالنا سیکھ سکتے ہو۔
