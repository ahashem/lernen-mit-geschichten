storyId: 012-max-kletterwand
drafted: '2026-11-04'
en:
  summary: Max gets stuck on the big climbing wall and cannot go on alone. He calls out for help and learns that accepting help is strong.
  keyMessage: Asking for help is not a weakness – it is a brave step towards your goal.
ar:
  summary: يعلق ماكس على جدار التسلّق الكبير ولا يستطيع أن يكمل وحده. فينادي طالبًا المساعدة، ويتعلّم أنّ قبول المساعدة قوّة.
  keyMessage: طلب المساعدة ليس ضعفًا، بل خطوة شجاعة نحو الهدف.
